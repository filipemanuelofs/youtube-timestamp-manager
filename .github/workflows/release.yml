name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - "youtube-timestamp-manager.user.js"
      - "package.json"
      - "README.md"
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-create-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Extract current version from userscript
        id: current-version
        run: |
          current_version=$(grep -oP '@version\s+\K[0-9]+\.[0-9]+\.[0-9]+' youtube-timestamp-manager.user.js)
          echo "current_version=$current_version" >> $GITHUB_OUTPUT
          echo "Current version: $current_version"

      - name: Calculate new version
        id: new-version
        # A mensagem do commit vem por env, não por ${{ }} dentro do run:. A
        # interpolação cola o texto no script antes do bash ver, então corpo de
        # commit com parêntese ou aspas quebra a sintaxe — e $(...) ou crase
        # executaria comando no runner, que aqui tem contents: write.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          current="${{ steps.current-version.outputs.current_version }}"
          IFS='.' read -r major minor patch <<< "$current"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bump_type="$INPUT_VERSION_TYPE"
          else
            commit_msg="$COMMIT_MSG"
            if [[ "$commit_msg" =~ ^(feat|feature)(\(.+\))?!: ]] || [[ "$commit_msg" =~ BREAKING.CHANGE ]]; then
              bump_type="major"
            elif [[ "$commit_msg" =~ ^(feat|feature)(\(.+\))?: ]]; then
              bump_type="minor"
            else
              bump_type="patch"
            fi
          fi

          case $bump_type in
            major) new_version="$((major + 1)).0.0" ;;
            minor) new_version="$major.$((minor + 1)).0" ;;
            patch) new_version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "bump_type=$bump_type" >> $GITHUB_OUTPUT
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "New version: $new_version (bump: $bump_type)"

      - name: Update version in userscript
        run: |
          new_version="${{ steps.new-version.outputs.new_version }}"
          sed -i "s/@version\s\+[0-9]\+\.[0-9]\+\.[0-9]\+/@version         $new_version/" youtube-timestamp-manager.user.js
          for readme in README.md README.pt-BR.md; do
            if [ -f "$readme" ]; then
              sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+-blue/version-$new_version-blue/" "$readme"
            fi
          done

      # The sed above only rewrites the @version header. __VERSION__ is inlined
      # into the bundle body at build time, so without this rebuild the settings
      # modal keeps showing the version from the last local build.
      - name: Rebuild userscript with bumped version
        run: |
          npm ci
          npm run build
          built_version=$(grep -oP '@version\s+\K[0-9]+\.[0-9]+\.[0-9]+' youtube-timestamp-manager.user.js)
          if [ "$built_version" != "${{ steps.new-version.outputs.new_version }}" ]; then
            echo "Build produced version $built_version, expected ${{ steps.new-version.outputs.new_version }}"
            exit 1
          fi

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate release notes
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            commits=$(git log --pretty=format:"- %s" --reverse)
          else
            commits=$(git log "${last_tag}..HEAD" --pretty=format:"- %s" --reverse)
          fi

          # Heredocs delimitados com aspas ('EOF') para o bash não expandir nada
          # vindo de commit. As expressões do GitHub continuam funcionando: elas
          # são substituídas no texto do script antes do bash rodar. Os assuntos
          # de commit entram por printf, senão um cifrão ou uma crase no assunto
          # viraria expansão de variável ou execução de comando.
          cat > release_notes.md << 'EOF'
          ## 🚀 What's New in v${{ steps.new-version.outputs.new_version }}

          ### Changes
          EOF

          printf '%s\n\n' "$commits" >> release_notes.md

          cat >> release_notes.md << 'EOF'
          ### 📦 Installation
          Click here to install/update: [youtube-timestamp-manager.user.js](https://github.com/${{ github.repository }}/releases/download/v${{ steps.new-version.outputs.new_version }}/youtube-timestamp-manager.user.js)

          ### 🔧 Compatibility
          - ✅ YouTube (all versions)
          - ✅ YouTube Live
          - ✅ YouTube Shorts
          - ✅ YouTube Mobile
          - ✅ YouTube Music

          ### 📋 Requirements
          - Modern browser (Chrome, Firefox, Safari, Edge)
          - Userscript manager (Violentmonkey, Tampermonkey, etc.)
          EOF

      - name: Commit version bump
        run: |
          git add youtube-timestamp-manager.user.js README.md README.pt-BR.md
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping."
          else
            git commit -m "🔼 Bump version to v${{ steps.new-version.outputs.new_version }}"
            git push origin main
          fi

      - name: Create Release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.new-version.outputs.new_version }}"
          title="YouTube Timestamp Manager ${tag}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, updating it instead."
            gh release edit "$tag" --title "$title" --notes-file release_notes.md
            gh release upload "$tag" ./youtube-timestamp-manager.user.js --clobber
            release_url=$(gh release view "$tag" --json url -q .url)
          else
            release_url=$(gh release create "$tag" \
              --title "$title" \
              --notes-file release_notes.md \
              ./youtube-timestamp-manager.user.js)
          fi
          echo "release_url=$release_url" >> $GITHUB_OUTPUT

      - name: Create success summary
        run: |
          echo "## ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.new-version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ steps.new-version.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ steps.create-release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Direct Install Link" >> $GITHUB_STEP_SUMMARY
          echo "[youtube-timestamp-manager.user.js](https://github.com/${{ github.repository }}/releases/download/v${{ steps.new-version.outputs.new_version }}/youtube-timestamp-manager.user.js)" >> $GITHUB_STEP_SUMMARY
